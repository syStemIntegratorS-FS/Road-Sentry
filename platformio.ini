[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM0        
monitor_rts = 0                    
monitor_dtr = 0                    
monitor_filters = 
    esp32_exception_decoder       
    default


build_flags =
    -D ARDUINO_USB_MODE=1          ; Enable S3 Native USB
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Route Serial output to USB CDC on boot
    -D FASTLED_INTERNAL            ; Mute FastLED internal RMT driver warning logs
    -D CORE_DEBUG_LEVEL=1          ; Quiet internal ESP-IDF traces (Errors only)


lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    fastled/FastLED @ 3.10.3
    knolleary/PubSubClient @ 2.8